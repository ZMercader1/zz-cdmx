<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06262d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CDMX">
<title>CDMX · show</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#06262d;--panel:#0b3640;--line:#15505c;--ink:#f2ece4;--mute:#9fbcc0;--rojo:#FF2539;--oro:#D5A44D;--cielo:#008DA2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 84px)}
h1{font-size:13px;letter-spacing:.18em;color:var(--oro);font-weight:700;margin-bottom:14px}
h2{font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:700;margin:22px 0 8px;text-transform:uppercase}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#041c21;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:600 11px/1 inherit;padding:12px 0 10px;letter-spacing:.06em}
nav button b{display:block;font-size:20px;margin-bottom:4px}
nav button.on{color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.big{font-size:44px;font-weight:800;line-height:1.05;letter-spacing:-.01em}
.mid{font-size:22px;font-weight:700}
.mute{color:var(--mute);font-size:13px}
.oro{color:var(--oro)}.rojo{color:var(--rojo)}
.bar{height:6px;background:#04191d;border-radius:3px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--rojo)}
.row{display:flex;gap:10px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line)}
.row .n{width:22px;color:var(--mute);font-size:12px;text-align:right;flex:none}
.row .t{flex:1;font-weight:700;text-transform:uppercase;letter-spacing:.01em}
.row .t small{font-size:10px;color:var(--mute);margin-left:4px;font-weight:600}
.row .h{color:var(--oro);font:600 13px ui-monospace,Menlo,monospace;flex:none}
.row .d{color:var(--mute);font:12px ui-monospace,Menlo,monospace;flex:none;width:38px;text-align:right}
.row.ch .t{font-weight:500;text-transform:none;color:var(--mute);font-style:italic}
.row.now{background:#12424c;border-radius:8px}
.lk{color:var(--rojo);font-weight:800;margin-right:4px}
textarea{width:100%;min-height:90px;background:#04191d;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:15px/1.4 inherit;resize:vertical}
button.btn{background:var(--ink);color:#06262d;border:0;border-radius:999px;padding:11px 18px;font:700 14px inherit;margin:8px 8px 0 0}
button.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
a{color:var(--ink)}
.tel{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.tel a{background:var(--rojo);color:#fff;text-decoration:none;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.ag{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.ag b{color:var(--oro);width:52px;flex:none;font-family:ui-monospace,Menlo,monospace}
.ag.past{opacity:.4}
.ln{padding:4px 0}
</style>
</head>
<body>
<h1>ZETAZEN · CDMX · 14 NOV</h1>

<section class="tab on" id="t-show"></section>
<section class="tab" id="t-set"><h2>Setlist · hora de México</h2><div id="setlist"></div></section>
<section class="tab" id="t-charlas"><h2>Lo que quiero decir</h2><div id="charlas"></div></section>
<section class="tab" id="t-viaje"><div id="viaje"></div></section>

<nav>
  <button data-t="show" class="on"><b>◷</b>SHOW</button>
  <button data-t="set"><b>≡</b>SETLIST</button>
  <button data-t="charlas"><b>✎</b>CHARLAS</button>
  <button data-t="viaje"><b>✈</b>VIAJE</button>
</nav>

<script>
const TZ='America/Mexico_City';
const SHOW=Date.parse('2026-11-14T20:30:00-06:00');
const AGENDA=[['17:00','Citación en la sala'],['17:15','Montaje'],['18:15','Prueba de sonido · escanear canal del micro'],['20:00','Puertas'],['20:20','Cuenta atrás (10 min)'],['20:30','SHOW'],['22:30','Fin']];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const hm=(ms,tz=TZ)=>new Date(ms).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:tz});
const store={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let SET=null, TL=[];
// línea de tiempo igual que la calculadora: la cuenta atrás va antes de las 20:30 y hay 20 s entre temas no enganchados
function build(){
  const it=SET.items, gap=SET.meta.gap; let pre=0,i=0; while(i<it.length&&it[i].k==='intro'){pre+=it[i].d;i++}
  let t=-pre; TL=it.map((x,j)=>{const s=t; t+=x.d; const nx=it[j+1]; if(nx&&x.k==='tema'&&nx.k==='tema'&&!x.link) t+=gap; return {...x,s,e:s+x.d}});
}
function origin(){const r=store.get('ensayo',null); return r?r:SHOW}

function renderShow(){
  const now=Date.now(), o=origin(), rel=(now-o)/1000, ensayo=!!store.get('ensayo',null);
  const first=TL[0].s, last=TL[TL.length-1].e;
  let h='';
  if(rel<first){
    const falta=(o+first*1000-now)/1000;
    h+=`<div class="card"><div class="mute">${ensayo?'Ensayo · empieza en':'Faltan para la cuenta atrás'}</div><div class="big">${falta>86400?Math.floor(falta/86400)+' d '+fmt(falta%86400):fmt(falta)}</div>
    <div class="mute" style="margin-top:6px">Show: sáb 14 · 20:30 en México = ${hm(SHOW,'Europe/Madrid')} en España</div></div>`;
    h+=`<div class="card"><div class="mute" style="margin-bottom:6px">Ahora en México: <b class="oro">${hm(now)}</b> · en España: ${hm(now,'Europe/Madrid')}</div>`;
    const dia=new Date(now).toLocaleDateString('es-ES',{timeZone:TZ}), showDia=new Date(SHOW).toLocaleDateString('es-ES',{timeZone:TZ});
    h+=AGENDA.map(([t,x])=>{const ms=Date.parse(`2026-11-14T${t}:00-06:00`);return `<div class="ag ${now>ms?'past':''}"><b>${t}</b><span>${esc(x)}</span></div>`}).join('')+`</div>`;
  } else if(rel>=last){
    h+=`<div class="card"><div class="big">Hecho. 🇲🇽</div><div class="mute" style="margin-top:6px">Has vendido CDMX entero.</div></div>`;
  } else {
    const k=TL.findIndex(x=>rel>=x.s&&rel<x.e)>=0?TL.findIndex(x=>rel>=x.s&&rel<x.e):TL.findIndex(x=>x.s>rel);
    const c=TL[k], nx=TL.slice(k+1).find(x=>x.k!=='charla'||x.d>5);
    const pct=Math.min(100,Math.max(0,(rel-c.s)/(c.e-c.s||1)*100));
    const n=TL.slice(0,k+1).filter(x=>x.k==='tema').length;
    h+=`<div class="card"><div class="mute">${c.k==='tema'?'Tema '+n+' · '+esc(c.key):c.k==='intro'?'Cuenta atrás':c.k==='descanso'?'Intermedio':'Charla'}</div>
      <div class="big">${esc(c.t)}</div><div class="bar"><i style="width:${pct}%"></i></div>
      <div class="mute" style="margin-top:6px">quedan ${fmt(c.e-rel)} · ${c.link?'<span class="rojo">ENGANCHA con el siguiente</span>':''}</div></div>`;
    if(nx) h+=`<div class="card"><div class="mute">Siguiente</div><div class="mid">${esc(nx.t)} <span class="mute">${esc(nx.key)}</span></div></div>`;
    h+=`<div class="card"><div class="mute">Quedan de show</div><div class="mid">${fmt(last-rel)}</div><div class="mute">acaba ~${hm(o+last*1000)}${ensayo?'':' (México)'}</div></div>`;
  }
  h+= ensayo?`<button class="btn alt" id="stopEns">Parar ensayo</button>`:`<button class="btn alt" id="ens">Ensayar ahora (el reloj arranca ya)</button>`;
  $('#t-show').innerHTML=h;
  $('#ens')&&($('#ens').onclick=()=>{store.set('ensayo',Date.now()-TL[0].s*1000);renderShow();renderSet()});
  $('#stopEns')&&($('#stopEns').onclick=()=>{store.set('ensayo',null);try{localStorage.removeItem('ensayo')}catch(e){};renderShow();renderSet()});
}
function renderSet(){
  const o=origin(), rel=(Date.now()-o)/1000; let n=0, prevLink=false;
  $('#setlist').innerHTML=TL.map(x=>{
    const now=rel>=x.s&&rel<x.e?' now':'';
    const hora=hm(o+x.s*1000);
    if(x.k==='tema'){n++; const r=`<div class="row${now}"><span class="n">${n}</span><span class="t">${prevLink?'<span class="lk">&gt;</span>':''}${esc(x.t)}<small>${esc(x.key)}</small></span><span class="h">${hora}</span><span class="d">${fmt(x.d)}</span></div>`; prevLink=x.link; return r}
    prevLink=false;
    const lab=x.k==='intro'?'Cuenta atrás':x.k==='outro'?'Música de salida':x.k==='descanso'?'— INTERMEDIO · '+esc(x.t.replace(/^INTERMEDIO\s*/i,'').replace(/[")]/g,''))+' —':'Charla';
    return `<div class="row ch${now}"><span class="n"></span><span class="t">${lab}</span><span class="h">${hora}</span><span class="d">${fmt(x.d)}</span></div>`;
  }).join('')+`<p class="mute" style="margin-top:10px">«>» = entra enganchado al anterior. Horas calculadas desde las 20:30 (México).</p>`;
}
function renderCharlas(){
  const notas=store.get('notas',{}); let i=0;
  const slots=TL.map((x,j)=>({x,j})).filter(({x})=>x.k==='charla'||x.k==='descanso');
  let h=`<div class="card"><div class="mute" style="margin-bottom:6px">Ideas sueltas</div><textarea data-k="general" placeholder="Lo que te salga en el avión…">${esc(notas.general||'')}</textarea></div>`;
  h+=slots.map(({x,j})=>{i++; const prev=TL.slice(0,j).reverse().find(y=>y.k==='tema'); const next=TL.slice(j+1).find(y=>y.k==='tema');
    return `<div class="card"><div class="mute" style="margin-bottom:6px">${x.k==='descanso'?'Intermedio':'Charla '+i} · después de <b>${esc(prev?prev.t:'—')}</b>, antes de <b>${esc(next?next.t:'—')}</b></div><textarea data-k="c${j}" placeholder="3-4 ideas…">${esc(notas['c'+j]||'')}</textarea></div>`}).join('');
  h+=`<p class="mute">Se guarda solo en este móvil, al momento.</p>`;
  $('#charlas').innerHTML=h;
  $('#charlas').oninput=e=>{const k=e.target.dataset.k;if(!k)return;const n=store.get('notas',{});n[k]=e.target.value;store.set('notas',n)};
}
function renderViaje(){
  const p=store.get('privado',null); let h='';
  if(p){
    if(p.contactos) h+=`<h2>Contactos</h2><div class="card">`+p.contactos.map(c=>`<div class="tel"><span>${esc(c.n)}</span><a href="tel:${esc(c.tel.replace(/\s/g,''))}">Llamar</a></div>`).join('')+`</div>`;
    (p.secciones||[]).forEach(s=>{h+=`<h2>${esc(s.t)}</h2><div class="card">`+s.l.map(l=>{
      const m=/^MAPA:(.*)$/.exec(l); if(m) return `<div class="ln"><a href="https://maps.apple.com/?q=${encodeURIComponent(m[1])}">📍 ${esc(m[1])}</a></div>`;
      return `<div class="ln">${esc(l)}</div>`}).join('')+`</div>`});
    h+=`<button class="btn alt" id="borrar">Borrar datos del viaje de este móvil</button>`;
  } else {
    h+=`<h2>Datos del viaje</h2><div class="card"><p style="margin-bottom:10px">Pega aquí el bloque del correo «App CDMX · datos privados». Se guarda solo en este móvil (no está en la web).</p>
    <textarea id="pega" placeholder='{"contactos":[…]}'></textarea><button class="btn" id="guardar">Guardar</button><p class="mute" id="msg"></p></div>`;
  }
  h+=`<h2>Sala</h2><div class="card"><div class="ln">CHICO CLUB · aforo 200</div><div class="ln"><a href="https://maps.apple.com/?q=${encodeURIComponent('Colima 367, Roma Norte, Ciudad de México')}">📍 Colima 367, Roma Norte</a></div></div>`;
  $('#viaje').innerHTML=h;
  $('#guardar')&&($('#guardar').onclick=()=>{try{const v=JSON.parse($('#pega').value.trim());store.set('privado',v);renderViaje()}catch(e){$('#msg').textContent='No se ha podido leer. Copia el bloque entero, desde { hasta }.'}});
  $('#borrar')&&($('#borrar').onclick=()=>{if(confirm('¿Borrar los datos del viaje de este móvil?')){try{localStorage.removeItem('privado')}catch(e){};renderViaje()}});
}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id==='t-'+b.dataset.t));store.set('tab',b.dataset.t)};
fetch('setlist.json').then(r=>r.json()).then(j=>{SET=j;build();renderShow();renderSet();renderCharlas();renderViaje();
  const t=store.get('tab','show'); document.querySelector(`nav button[data-t="${t}"]`)?.click();
  setInterval(()=>{renderShow(); if(document.querySelector('#t-set.on')) renderSet()},1000);
});
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
